spring.application.name=blog-application
server.port=8080

# Default profile is 'local' (H2 in MySQL mode) for instant zero-config evaluation
# Set SPRING_PROFILES_ACTIVE=prod in production (Render / Railway) for full MySQL
spring.profiles.default=local

# JWT Configuration
app.jwt.secret=${JWT_SECRET:SuperSecretBlogKeyForJwtSigningMustBeAtLeast256BitsLongProfessionalAssessment2026!}
app.jwt.expiration-ms=86400000

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
